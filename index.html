<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How Does Attention Work Now? &bull; Chronological, Honest & Interactive Explainer (2014 - 2026)</title>
    <meta name="description" content="A state-of-the-art interactive historical explainer covering every attention mechanism from standard dot-product attention (2017) to DeepSeek-V4.1 CSA2 (2026)." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX for crisp LaTeX mathematics -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>
  </head>
  <body>
    <div id="app">
      <!-- Static Fallback for No-JS and SEO -->
      <noscript>
        <div style="padding: 2rem; max-width: 800px; margin: 0 auto; color: #f8fafc; background: #0f172a; font-family: sans-serif; line-height: 1.6;">
          <h1>How Does Attention Work Now? (2014 - 2026)</h1>
          <p>
            This interactive application explores 30 verified attention mechanisms across a decade of machine learning evolution.
            JavaScript is currently disabled, but full static markdown and primary source logs are available in the repository at
            <code>docs/verification-log.md</code> and <code>data/mechanisms.json</code>.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
